name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux-x86_64
          - os: macos-14
            artifact: macos-arm64
          - os: windows-latest
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Tk on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev,desktop,voice]"
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_executable.py
      - name: Package Linux application
        if: runner.os == 'Linux'
        run: tar -C dist -czf CodexTelegramBot-linux-x86_64.tar.gz CodexTelegramBot
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/CodexTelegramBot.app CodexTelegramBot-macos-arm64.zip
      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/CodexTelegramBot.exe -DestinationPath CodexTelegramBot-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CodexTelegramBot-${{ matrix.artifact }}
          path: CodexTelegramBot-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/*/* --generate-notes
